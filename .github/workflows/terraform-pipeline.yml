name: Terraform Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Required to read repository contents

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533613205608:role/github-actions-terraform-role
          aws-region: us-east-1  # Replace with your target AWS region (e.g., ap-southeast-2)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Execution
        run: |
          ACTION="${{ github.event.inputs.action || 'apply' }}"
          echo "Executing terraform $ACTION..."
          terraform $ACTION -auto-approve
